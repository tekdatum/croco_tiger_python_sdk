[project]
name = "crocotiger_sdk"
version = "0.1.0"
description = "CrocoTiger SDK"
readme = "README.md"
requires-python = ">=3.11"
optional-dependencies = { test = ["pytest", "pytest-mock"] }

[tool.setuptools.packages.find]
where = ["crocotiger_sdk"]


# PyTest CONFIGURATION
[tool.pytest.ini_options]
# Sets the root directory for tests
testpaths = ["tests"]
addopts = "-vv --showlocals"
pythonpath = ["crocotiger_sdk"]

# MYPY CONFIGURATION

[tool.mypy]
python_version = "3.12"
strict = true

exclude = [
    "docs/",
    "venv/",
    "engine_sdk/"
]

[[tool.mypy.overrides]]
module = ["requests.*"]
ignore_missing_imports = true

# ------------------------------------------------------------------

# RUFF CONFIGURATION

[tool.ruff]
line-length = 88
target-version = "py310"

# linter configuration
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# ... https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = ["E", "F"] 
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"