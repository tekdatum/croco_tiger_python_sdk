name: Quality & Tests
on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - 'feature/**'
      - 'bugfix/**'

jobs:
  qa_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Ruff Check (Linting)
        run: ruff check .

      - name: Ruff Format (Style)
        run: ruff format --check .

      - name: Run Pytest
        run: pytest --cov=crocotiger_sdk --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-fail-under=90

      - name: Surface Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() # Runs even if tests fail
        with:
          files: pytest.xml

      - name: Add Coverage PR Comment
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          output: both